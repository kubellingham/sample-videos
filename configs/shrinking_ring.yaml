# One video = one config. `seed` makes it fully reproducible;
# `batch` renders many seeds of the same config.
format: shrinking_ring
seed: 7
palette: neon            # neon | sunset | ocean | forest | candy | mono | aurora | ember | random
sound_set: pentatonic    # pentatonic | melody | tactile | ambient
duration: 40             # seconds, maximum; pacing aims the ending at 55-100% of this
hook_text: "Will it escape before it fills the ring?"

sound:                   # optional, see `python -m satisfy sounds`
  instrument: marimba
  pattern: updown

params:                  # optional, see `python -m satisfy formats`
  mode: grow             # grow: each bounce grows the ball | spawn: each bounce adds a ball
